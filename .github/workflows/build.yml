name: Deploy Spring Application

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew build -x test

    - name: Copy application.yml from server
      uses: appleboy/scp-action@master
      with:
        host: ${{ vars.SERVER_HOST }}
        username: ${{ vars.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ vars.SERVER_PORT }}
        source: "${{ vars.DEPLOY_PATH }}/application.yml"
        target: "src/main/resources/"
        strip_components: 1

    - name: Build with Gradle (after copying application.yml)
      run: ./gradlew build -x test

    - name: Deploy to Server
      uses: appleboy/scp-action@master
      with:
        host: ${{ vars.SERVER_HOST }}
        username: ${{ vars.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ vars.SERVER_PORT }}
        source: "build/libs/*.jar"
        target: ${{ vars.DEPLOY_PATH }}
        strip_components: 2

    - name: Execute deploy script
      uses: appleboy/ssh-action@master
      with:
        host: ${{ vars.SERVER_HOST }}
        username: ${{ vars.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ vars.SERVER_PORT }}
        script: |
          cd ${{ vars.DEPLOY_PATH }}
          if pgrep java; then
            pkill java
          fi
          nohup java -jar ${{ vars.JAR_NAME }} > app.log 2>&1 &
