name: Deploy Spring Application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    # SSH 키 설정 단계 추가
    - name: Set up SSH keys
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ vars.SERVER_HOST }} >> ~/.ssh/known_hosts

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew build -x test

    - name: Copy application.yml from server
      run: |
        scp -P ${{ vars.SERVER_PORT }} ${{ vars.SERVER_USER }}@${{ vars.SERVER_HOST }}:${{ vars.DEPLOY_PATH }}/application.yml src/main/resources/

    - name: Build with Gradle (after copying application.yml)
      run: ./gradlew build -x test

    - name: Deploy to Server
      run: |
        scp -P ${{ vars.SERVER_PORT }} build/libs/*.jar ${{ vars.SERVER_USER }}@${{ vars.SERVER_HOST }}:${{ vars.DEPLOY_PATH }}/

    - name: Execute deploy script
      run: |
        ssh -p ${{ vars.SERVER_PORT }} ${{ vars.SERVER_USER }}@${{ vars.SERVER_HOST }} "
          cd ${{ vars.DEPLOY_PATH }} && 
          if pgrep java; then pkill java; fi && 
          nohup java -jar ${{ vars.JAR_NAME }} > app.log 2>&1 &
        "

    # 작업 완료 후 SSH 키 정리
    - name: Cleanup SSH keys
      if: always()
      run: rm -rf ~/.ssh
